name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    if: github.repository == 'ShieldaAI/select-all-matching'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install declared npm version
        run: npm install --global npm@11.11.0

      - name: Check tag and package version
        id: release
        run: node scripts/release-version.mjs

      - name: Install dependencies
        run: npm ci

      - name: Check source and coverage
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm run test:release
          npm run test:coverage

      - name: Build and test the release artifact
        run: npm run package:check -- --pack-destination "$RUNNER_TEMP/release"

      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Test the example against the release artifact
        env:
          TARBALL: ${{ steps.release.outputs.tarball }}
        run: npm run example:check -- --tarball "$RUNNER_TEMP/release/$TARBALL" --browser

      - name: Publish the tested artifact
        env:
          TARBALL: ${{ steps.release.outputs.tarball }}
          CHANNEL: ${{ steps.release.outputs.channel }}
        run: npm publish "$RUNNER_TEMP/release/$TARBALL" --ignore-scripts --access public --tag "$CHANNEL" --provenance
