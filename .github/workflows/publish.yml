name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    if: github.repository == 'ShieldaAI/select-all-matching'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      sha256: ${{ steps.digest.outputs.sha256 }}

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require a release commit from main
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.x"
          package-manager-cache: false

      - name: Install declared npm version
        run: npm install --global npm@11.11.0 --ignore-scripts --registry=https://registry.npmjs.org

      - name: Check tag and package version
        id: release
        run: node scripts/release-version.mjs

      - name: Install dependencies
        run: npm ci

      - name: Check source and coverage
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm run test:release
          npm run test:coverage

      - name: Build and test the release artifact
        run: npm run package:check -- --pack-destination "$RUNNER_TEMP/release"

      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Test the example against the release artifact
        env:
          TARBALL: ${{ steps.release.outputs.tarball }}
        run: npm run example:check -- --tarball "$RUNNER_TEMP/release/$TARBALL" --browser

      - name: Hash the tested tarball
        id: digest
        env:
          TARBALL: ${{ steps.release.outputs.tarball }}
        run: |
          digest=$(sha256sum "$RUNNER_TEMP/release/$TARBALL" | cut -d ' ' -f 1)
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"

      - name: Keep the verified release artifact
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release/${{ steps.release.outputs.tarball }}
          if-no-files-found: error
          overwrite: false
          retention-days: 14

  publish:
    name: Publish approved artifact
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: npm-publish
    permissions:
      id-token: write

    steps:
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Install declared npm version
        run: npm install --global npm@11.11.0 --ignore-scripts --registry=https://registry.npmjs.org

      - name: Download this run's immutable artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.validate.outputs.artifact-id }}
          path: ${{ runner.temp }}/release
          merge-multiple: true
          digest-mismatch: error

      - name: Verify the tarball before publishing
        id: artifact
        env:
          EXPECTED_SHA256: ${{ needs.validate.outputs.sha256 }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { appendFileSync, lstatSync, readFileSync, readdirSync } from 'node:fs';
          import { join } from 'node:path';

          const tag = process.env.GITHUB_REF_NAME;
          const number = '(?:0|[1-9][0-9]*)';
          const identifier = `(?:${number}|[0-9]*[A-Za-z-][0-9A-Za-z-]*)`;
          const pattern = new RegExp(`^v${number}\\.${number}\\.${number}(?:-${identifier}(?:\\.${identifier})*)?$`);
          assert.equal(typeof tag, 'string');
          assert.equal(pattern.exec(tag)?.[0], tag, 'Expected an exact release tag');
          const version = tag.slice(1);
          const directory = join(process.env.RUNNER_TEMP, 'release');
          const filename = `select-all-matching-${version}.tgz`;
          assert.deepEqual(readdirSync(directory), [filename], 'Expected only the release tarball');
          const tarball = join(directory, filename);
          assert.ok(lstatSync(tarball).isFile(), 'The tarball must be a regular file');
          const digest = process.env.EXPECTED_SHA256;
          assert.equal(typeof digest, 'string');
          assert.match(digest, /^[a-f0-9]{64}$/);
          assert.equal(createHash('sha256').update(readFileSync(tarball)).digest('hex'), digest);
          const manifest = JSON.parse(execFileSync('tar', ['-xOf', tarball, 'package/package.json'], {
            encoding: 'utf8', maxBuffer: 64 * 1024,
          }));
          assert.equal(manifest.name, 'select-all-matching');
          assert.equal(manifest.version, version);
          assert.equal(manifest.repository?.url, 'git+https://github.com/ShieldaAI/select-all-matching.git');
          const channel = version.includes('-') ? 'next' : 'latest';
          appendFileSync(process.env.GITHUB_OUTPUT, `tarball=${tarball}\nchannel=${channel}\n`);
          NODE

      - name: Publish without running package scripts
        env:
          TARBALL: ${{ steps.artifact.outputs.tarball }}
          CHANNEL: ${{ steps.artifact.outputs.channel }}
        run: npm publish "$TARBALL" --ignore-scripts --registry=https://registry.npmjs.org --access public --tag "$CHANNEL" --provenance
