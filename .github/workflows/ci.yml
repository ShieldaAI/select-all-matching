name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node:
          - "22"
          - "24"

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.11.0

      - name: Install dependencies
        run: npm ci

      - name: Run required checks
        run: npm run check

      - name: Collect coverage
        if: matrix.node == '24'
        run: npm run test:coverage

  runtime-minimums:
    name: One artifact on runtime minima
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up artifact build runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm

      - name: Pin artifact build npm
        run: npm install --global npm@11.11.0

      - name: Build one packed artifact
        run: |
          npm ci
          npm run build
          mkdir -p "${{ runner.temp }}/select-all-matching-artifact"
          npm pack --pack-destination "${{ runner.temp }}/select-all-matching-artifact"

      - name: Set up Node.js 22 minimum
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.0.0"

      - name: Run packed artifact on Node.js 22 minimum
        run: node ./scripts/test-packed-runtime.mjs "${{ runner.temp }}/select-all-matching-artifact"

      - name: Set up Node.js 24 minimum
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.0.0"

      - name: Run the same packed artifact on Node.js 24 minimum
        run: node ./scripts/test-packed-runtime.mjs "${{ runner.temp }}/select-all-matching-artifact"

  windows-packed:
    name: Packed consumer on Windows
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.11.0

      - name: Install dependencies
        run: npm ci

      - name: Validate the packed artifact
        run: npm run package:check

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
